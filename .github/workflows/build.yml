name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev zlib1g-dev python3-pip \
            autoconf libtool pkg-config patch libncurses6:i386 \
            libstdc++6:i386 zlib1g:i386

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Setup Android SDK, Command Line Tools & Licenses
        run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mv /tmp/cmdtools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          ln -sf $SDK_DIR/cmdline-tools/latest $SDK_DIR/tools

          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true

      - name: Run Buildozer
        run: |
          buildozer -v android debug
        env:
          # Жестко перенаправляем пути на изолированный SDK и NDK от buildozer, игнорируя системные хоста
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
