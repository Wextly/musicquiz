name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev zlib1g-dev python3-pip \
            autoconf libtool pkg-config patch libncurses6:i386 \
            libstdc++6:i386 zlib1g:i386

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Setup Android SDK and Command Line Tools
        run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR
          
          # Скачиваем актуальные Android Command Line Tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          
          # Раскладываем по путям, которые ожидает buildozer
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mv /tmp/cmdtools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          # Создаем симлинк для совместимости со старыми путями sdkmanager
          ln -s $SDK_DIR/cmdline-tools/latest $SDK_DIR/tools

          # Предзаписываем принятые лицензии
          mkdir -p $SDK_DIR/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131e6bbf9" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a43b680d2301de932f462730f924number" >> $SDK_DIR/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK_DIR/licenses/android-sdk-license

      - name: Run Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
